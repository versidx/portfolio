<!doctype html>
<html lang="fr">
  <!--
    PORTFOLIO BTS SIO SISR : Durai AMRI
      1. style     : le design (thèmes, fenêtres, menu, mise en page)
      2. body      : barre du haut, colonne profil, contenu, pied de page
      3. script    : contenu (réalisations, veille, pages), navigation, thèmes, couleurs
  
    Pour modifier : cherche [[ pour les textes à compléter, const PAL pour les couleurs.
  -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Portfolio BTS SIO SISR – Durai AMRI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Thème appliqué tout de suite pour éviter un flash -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <style>
      /* ===== THÈMES : variables de couleurs (sombre par défaut, clair plus bas) ===== */
      :root {
        --bg1: #050505;
        --bg2: #141414;
        --glass: rgba(16, 16, 16, 0.68);
        --tx: #ececec;
        --mu: #9b9b9b;
        --a1: #f5f5f5;
        --a2: #b8b8b8;
        --a3: #7a7a7a;
        --ln: rgba(255, 255, 255, 0.12);
        --dim: rgba(0, 0, 0, 0.45);
        --on: #0a0a0a;
        --sh: rgba(0, 0, 0, 0.55);
        --r: 14px;
        --g: 12px;
        --bl: 16px;
        --ease: cubic-bezier(0.05, 0.9, 0.1, 1.05);
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      :root[data-theme="light"] {
        --bg1: #ffffff;
        --bg2: #ebebeb;
        --glass: rgba(255, 255, 255, 0.7);
        --tx: #1c1c1c;
        --mu: #6b6b6b;
        --a1: #2e2e2e;
        --a2: #737373;
        --a3: #bdbdbd;
        --ln: rgba(0, 0, 0, 0.15);
        --dim: rgba(255, 255, 255, 0.35);
        --on: #fff;
        --sh: rgba(0, 0, 0, 0.16);
      }
      /* ===== ANIMATIONS ===== */
      @property --ang {
        syntax: "<angle>";
        inherits: false;
        initial-value: 0deg;
      }
      @keyframes spin {
        to {
          --ang: 360deg;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.93) translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* ===== BASE ===== */
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
        scrollbar-width: thin;
        scrollbar-color: var(--a1) transparent;
      }
      ::selection {
        background: var(--a1);
        color: var(--on);
      }
      /* ===== FOND DE PAGE (fond.jpg est ajouté par le script) ===== */
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--tx);
        font:
          14px/1.6 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: var(--bg1);
        background:
          radial-gradient(
            900px 520px at 10% -5%,
            color-mix(in srgb, var(--a3) 32%, transparent),
            transparent 60%
          ),
          radial-gradient(
            800px 520px at 100% 8%,
            color-mix(in srgb, var(--a1) 26%, transparent),
            transparent 60%
          ),
          linear-gradient(160deg, var(--bg1), var(--bg2)) fixed;
      }
      body.fond {
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
      }
      body.fond::before {
        content: "";
        position: fixed;
        inset: 0;
        background: var(--dim);
        z-index: -1;
      }
      a {
        color: var(--a1);
      }
      h1,
      h2,
      h3,
      h4 {
        font-family: var(--mono);
        margin: 0 0 0.5rem;
        line-height: 1.25;
      }
      /* ===== FENÊTRES : verre flou et bordure lumineuse animée ===== */
      #top,
      .sb,
      .card,
      .hero,
      .note {
        position: relative;
        border-radius: var(--r);
        background: var(--glass);
        -webkit-backdrop-filter: blur(var(--bl)) saturate(150%);
        backdrop-filter: blur(var(--bl)) saturate(150%);
        box-shadow: 0 10px 30px var(--sh);
        transition:
          transform 0.45s var(--ease),
          box-shadow 0.45s var(--ease);
      }
      #top::before,
      .sb::before,
      .card::before,
      .hero::before,
      .note::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 2px;
        background: conic-gradient(from var(--ang), var(--a1), var(--a2), var(--a3), var(--a1));
        opacity: 0.4;
        -webkit-mask:
          linear-gradient(#000 0 0) content-box,
          linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: spin 9s linear infinite;
        pointer-events: none;
        transition: opacity 0.45s var(--ease);
      }
      #top:hover::before,
      .sb:hover::before,
      .card:hover::before,
      .hero:hover::before,
      .note:hover::before,
      .card:focus-within::before {
        opacity: 1;
        animation-duration: 3.5s;
      }
      .sb:hover,
      .card:hover,
      .hero:hover {
        transform: translateY(-3px);
        box-shadow:
          0 0 26px color-mix(in srgb, var(--a1) 30%, transparent),
          0 14px 34px var(--sh);
      }
      /* ===== BARRE DU HAUT ===== */
      #top {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        width: calc(100% - 24px);
        max-width: 1280px;
        margin: 8px auto 0;
        padding: 0.4rem 0.6rem;
        position: sticky;
        top: calc(env(safe-area-inset-top, 0px) + 8px);
        z-index: 10;
        border-radius: 999px;
      }
      /* ===== MENU (espaces de travail) ===== */
      nav {
        display: flex;
        gap: 0.2rem;
        overflow-x: auto;
        scrollbar-width: none;
        counter-reset: ws;
        min-width: 0;
        flex: 0 1 auto;
      }
      nav a {
        counter-increment: ws;
        font: 600 0.78rem var(--mono);
        color: var(--mu);
        text-decoration: none;
        padding: 0.35rem 0.65rem;
        border-radius: 999px;
        white-space: nowrap;
        flex: none;
        transition: all 0.35s var(--ease);
      }
      nav a::before {
        content: counter(ws);
        opacity: 0.55;
        margin-right: 0.4rem;
      }
      nav a:hover {
        color: var(--tx);
        background: var(--ln);
      }
      nav a.on {
        color: var(--on);
        background: linear-gradient(135deg, var(--a1), var(--a2));
        box-shadow: 0 0 16px color-mix(in srgb, var(--a1) 55%, transparent);
      }
      #ban {
        margin-left: auto;
        font: 700 0.85rem var(--mono);
        white-space: nowrap;
        flex: none;
      }
      #ban small {
        display: none;
      }
      #clk {
        font: 0.78rem var(--mono);
        color: var(--a2);
        padding: 0 0.6rem;
        white-space: nowrap;
      }
      /* ===== MISE EN PAGE : grille en mosaïque ===== */
      #wrap {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: var(--g);
        max-width: 1280px;
        margin: var(--g) auto;
        padding: 0 12px;
        align-items: start;
      }
      aside {
        position: sticky;
        top: calc(env(safe-area-inset-top, 0px) + 70px);
      }
      main {
        min-width: 0;
      }
      section.on {
        display: flex;
        flex-direction: column;
        gap: var(--g);
      }
      section.on > * {
        margin: 0;
        animation: pop 0.55s var(--ease) backwards;
      }
      section.on > :nth-child(2) {
        animation-delay: 0.05s;
      }
      section.on > :nth-child(3) {
        animation-delay: 0.1s;
      }
      section.on > :nth-child(4) {
        animation-delay: 0.15s;
      }
      section.on > :nth-child(5) {
        animation-delay: 0.2s;
      }
      section.on > :nth-child(n + 6) {
        animation-delay: 0.25s;
      }
      @media (max-width: 1180px) {
        #clk {
          display: none;
        }
      }
      @media (max-width: 980px) {
        #ban {
          display: none;
        }
        #thm {
          margin-left: auto;
        }
      }
      @media (max-width: 600px) {
        #thm span {
          display: none;
        }
      }
      @media (max-width: 860px) {
        #wrap {
          grid-template-columns: 1fr;
        }
        aside {
          position: static;
        }
      }
      /* ===== COLONNE PROFIL ===== */
      .sb {
        margin-bottom: var(--g);
        font-size: 0.85rem;
      }
      .sb h4 {
        color: var(--a1);
        font-size: 0.8rem;
        padding: 0.7rem 0.9rem 0.1rem;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .sb div {
        padding: 0.5rem 0.9rem 0.8rem;
      }
      .sb p {
        margin: 0.25rem 0;
      }
      .ph {
        width: 160px;
        max-width: 100%;
        aspect-ratio: 3/4;
        margin: 0 auto 0.6rem;
        border: 1px dashed var(--ln);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: var(--mu);
      }
      .ph.has {
        border: 0;
      }
      .ph img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      /* ===== TITRES ET CARTES ===== */
      h2 {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 1.3rem;
        color: var(--a1);
        text-shadow: 0 0 18px color-mix(in srgb, var(--a1) 50%, transparent);
      }
      h2::before {
        content: "❯";
        color: var(--a2);
      }
      h2::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--a1), transparent);
      }
      h3 {
        font-size: 0.9rem;
        color: var(--a2);
        margin-top: 0.4rem;
      }
      .card h3 {
        margin-top: 0;
      }
      .card,
      .hero,
      .note {
        padding: 1rem 1.15rem;
      }
      .note {
        color: var(--mu);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: var(--g);
        grid-auto-flow: dense;
      }
      .grid .card {
        margin: 0;
      }
      /* ===== ACCUEIL ===== */
      .hero h1 {
        font-size: clamp(1.8rem, 5vw, 2.8rem);
        background: linear-gradient(90deg, var(--a1), var(--a2), var(--a3));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .hero p {
        color: var(--mu);
      }
      .ports {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
        margin: 0.9rem 0;
      }
      .ports span {
        font: 700 0.78rem var(--mono);
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 0.2rem 0.55rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .ports span:before {
        content: "";
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: var(--a2);
        box-shadow: 0 0 8px var(--a2);
      }
      /* ===== BOUTONS ===== */
      .btn {
        display: inline-block;
        font: 600 0.8rem var(--mono);
        color: var(--a1);
        text-decoration: none;
        padding: 0.45rem 1rem;
        margin: 0.2rem 0.35rem 0.2rem 0;
        border: 1px solid color-mix(in srgb, var(--a1) 55%, transparent);
        border-radius: 999px;
        transition: all 0.4s var(--ease);
      }
      .btn:hover {
        background: linear-gradient(135deg, var(--a1), var(--a2));
        color: var(--on);
        transform: translateY(-2px);
        box-shadow: 0 0 18px color-mix(in srgb, var(--a1) 50%, transparent);
      }
      /* ===== TABLEAUX ===== */
      table {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        font-size: 0.85rem;
      }
      th,
      td {
        border-bottom: 1px solid var(--ln);
        padding: 0.45rem 0.6rem;
        text-align: left;
        vertical-align: top;
      }
      th {
        font-family: var(--mono);
        color: var(--a1);
      }
      tr:last-child td {
        border-bottom: 0;
      }
      tr:hover td {
        background: color-mix(in srgb, var(--a1) 8%, transparent);
      }
      .sc {
        overflow-x: auto;
        padding: 0.4rem 0.6rem;
      }
      .sc::before {
        display: none;
      }
      .sc {
        border: 1px solid var(--ln);
      }
      .ok {
        color: var(--a2);
        font-weight: 700;
        text-align: center;
        text-shadow: 0 0 8px var(--a2);
      }
      /* ===== FICHES DÉPLIABLES (réalisations, veille, stage) ===== */
      details.card summary {
        cursor: pointer;
        font: 700 0.9rem var(--mono);
        list-style: none;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex-wrap: wrap;
      }
      details.card summary::-webkit-details-marker {
        display: none;
      }
      details.card summary::before {
        content: "▸";
        color: var(--a2);
        transition: transform 0.4s var(--ease);
      }
      details[open] summary::before {
        transform: rotate(90deg);
      }
      i.t {
        font: 700 0.68rem var(--mono);
        font-style: normal;
        background: linear-gradient(135deg, var(--a1), var(--a2));
        color: var(--on);
        border-radius: 999px;
        padding: 0.05rem 0.5rem;
      }
      dl {
        margin: 0.7rem 0 0;
      }
      dt {
        font: 700 0.78rem var(--mono);
        color: var(--a1);
        margin-top: 0.6rem;
      }
      dd {
        margin: 0.1rem 0 0 0.2rem;
        border-left: 2px solid var(--ln);
        padding-left: 0.7rem;
      }
      .per {
        color: var(--mu);
        margin: 0.2rem 0 0;
        font-size: 0.8rem;
      }
      ul {
        padding-left: 1.2rem;
        margin: 0.3rem 0;
      }
      /* ===== BOUTONS THÈME ET COULEURS ===== */
      #thm,
      #pal {
        font: 700 0.78rem var(--mono);
        color: var(--tx);
        background: none;
        border: 1px solid var(--ln);
        border-radius: 999px;
        padding: 0.32rem 0.75rem;
        cursor: pointer;
        white-space: nowrap;
        flex: none;
        transition: all 0.4s var(--ease);
      }
      #thm:hover,
      #pal:hover {
        background: linear-gradient(135deg, var(--a1), var(--a2));
        color: var(--on);
        box-shadow: 0 0 16px color-mix(in srgb, var(--a1) 50%, transparent);
      }
      /* ===== THÈME CLAIR : réglages spécifiques ===== */
      :root[data-theme="light"] body {
        background:
          radial-gradient(700px 420px at 12% 0%, rgba(255, 255, 255, 0.95), transparent 60%),
          radial-gradient(800px 500px at 92% 4%, rgba(222, 222, 222, 0.85), transparent 60%),
          radial-gradient(900px 600px at 50% 105%, rgba(235, 235, 235, 0.9), transparent 60%),
          linear-gradient(160deg, #fff, #e8e8e8) fixed;
      }
      :root[data-theme="light"] .hero h1 {
        background-image: linear-gradient(90deg, var(--a1), var(--a2));
      }
      :root[data-theme="light"] h2 {
        text-shadow: none;
      }
      /* ===== SÉLECTEUR DE COULEURS ===== */
      #palp {
        position: absolute;
        right: 0;
        top: calc(100% + 10px);
        width: 250px;
        padding: 0.9rem;
        border-radius: var(--r);
        background: var(--bg2);
        border: 1px solid var(--ln);
        box-shadow: 0 14px 34px var(--sh);
        display: grid;
        gap: 0.7rem;
        animation: pop 0.35s var(--ease);
      }
      #palp[hidden] {
        display: none;
      }
      #palp .sw {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      #palp button.s {
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        border: 2px solid var(--ln);
        cursor: pointer;
        transition: transform 0.35s var(--ease);
      }
      #palp button.s:hover {
        transform: scale(1.15);
      }
      #palp button.s.on {
        border-color: var(--tx);
        box-shadow: 0 0 10px var(--a1);
      }
      #palp label {
        font: 0.72rem var(--mono);
        color: var(--mu);
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      #palp input {
        width: 2rem;
        height: 1.6rem;
        border: 0;
        background: none;
        padding: 0;
        cursor: pointer;
      }
      /* ===== DIVERS : surlignage désactivé, pied de page ===== */
      mark {
        background: none;
        color: inherit;
        padding: 0;
      }
      footer {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0.8rem 1rem 1.2rem;
        text-align: center;
        color: var(--mu);
        font: 0.72rem/1.6 var(--mono);
      }
      /* ===== ACCESSIBILITÉ : animations coupées si demandé ===== */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Barre du haut -->
    <header id="top">
      <nav id="nav"></nav>
      <div id="ban">Durai AMRI<small>Portfolio professionnel · BTS SIO option SISR · </small></div>
      <div id="clk"></div>
      <button id="thm" type="button" title="Changer de thème" aria-label="Changer de thème"></button>
      <button id="pal" type="button" title="Couleurs" aria-label="Changer les couleurs">◐</button>
      <div id="palp" hidden></div>
    </header>
    <!-- Colonne profil + contenu (remplis par le script) -->
    <div id="wrap">
      <aside id="side"></aside>
      <main id="m"></main>
    </div>
    <!-- Pied de page -->
    <footer>
      Portfolio E5 – Support et mise à disposition de services informatiques · Lycée Marie Curie · Session
      2027<br />Dernière mise à jour : <mark>02/09/2026</mark>
    </footer>
    <script>
      // ===== 1. OUTIL =====
      // h() : le texte entre [[ ]] est un texte à compléter (affiché normalement)
      const h = (s) => s.replace(/\[\[(.+?)\]\]/g, "<mark>$1</mark>");
      // ===== 2. CONTENU : tes textes =====
      // L : intitulés des champs d'une fiche de réalisation
      const L = [
        "Contexte",
        "Besoin / objectif",
        "Environnement technique",
        "Travail personnel",
        "Difficulté & diagnostic",
        "Solution mise en œuvre",
        "Tests & résultats",
        "Documentation / preuves",
        "Bilan",
      ];
      // R : réalisations. Chaque entrée = [titre, période, compétences, [9 champs]]
      const R = [
        [
          "Mise en place de GLPI : inventaire et gestion des tickets",
          "Nov. 2025 – [[durée]]",
          "1,2,5",
          [
            "Parc fictif d'une PME de [[30]] postes (TP encadré, lycée Marie Curie).",
            "Recenser le matériel et suivre les incidents de façon traçable.",
            "VM Debian [[12]], Apache, MariaDB, GLPI [[10.x]], agent GLPI Inventory.",
            "Installation, entités et profils, import des utilisateurs, déploiement de l'agent, catégories de tickets.",
            "Postes absents de l'inventaire : lecture des logs de l'agent puis vérification de l'URL du serveur et du pare-feu.",
            "URL de l'agent corrigée, règle de pare-feu ajoutée, inventaire relancé.",
            "[[5]] postes remontés ; ticket ouvert, attribué, résolu et clôturé de bout en bout.",
            "Procédure d'installation, guide « ouvrir un ticket », captures d'écran.",
            "J'ai appris à structurer un parc ; je prévoirais la sauvegarde de la base dès le départ.",
          ],
        ],
        [
          "Déploiement AD DS, DHCP, DNS et GPO sous Windows Server",
          "Déc. 2025 – [[durée]]",
          "1,5",
          [
            "Maquette virtualisée d'une petite entreprise [[20]] utilisateurs.",
            "Centraliser comptes, adressage IP et paramètres des postes.",
            "Windows Server [[2022]], client Windows 11, Oracle VirtualBox.",
            "Promotion du contrôleur de domaine, étendue DHCP, zones DNS, unités d'organisation, GPO (mappage lecteur, fond d'écran, mots de passe).",
            "Un client ne recevait aucune adresse : service DHCP, autorisation dans l'AD et étendue contrôlés.",
            "Étendue activée et serveur DHCP autorisé dans l'annuaire.",
            "ipconfig /all, gpupdate /force, gpresult : adresses et GPO appliquées. Capture Wireshark des échanges DHCP (Discover, Offer, Request, Ack).",
            "Schéma réseau, captures de configuration, procédure pas à pas.",
            "Mieux nommer mes OU dès le début ; documenter chaque GPO.",
          ],
        ],
        [
          "Supervision d'un parc avec Zabbix",
          "Janv. 2026 – [[durée]]",
          "2,5,6",
          [
            "Besoin de détecter une panne avant l'appel de l'utilisateur.",
            "Surveiller serveurs et équipements, alerter par e-mail.",

          b.style.background = "conic-gradient(" + q.join(",") + "," + q[0] + ")";
          b.classList.toggle("on", +b.dataset.i == pi);
        });
        palp.querySelectorAll("input").forEach((x, i) => (x.value = c[i]));
      }
      pal.onclick = () => {
        palp.hidden = !palp.hidden;
      };
      palp.onclick = (e) => {
        const b = e.target.closest && e.target.closest(".s");
        if (b) {
          pi = +b.dataset.i;
          savePal();
          applyPal();
        }
      };
      palp.oninput = (e) => {
        if (e.target.type == "color") {
          cu = [...palp.querySelectorAll("input")].map((x) => x.value);
          pi = -1;
          savePal();
          applyPal();
        }
      };
      document.addEventListener("click", (e) => {
        if (!palp.hidden && !e.target.closest("#palp,#pal")) palp.hidden = true;
      });
      // ===== 7. THÈME NOIR / CLAIR =====
      const thm = document.getElementById("thm");
      function setTheme(t) {
        document.documentElement.dataset.theme = t;
        thm.innerHTML = t == "light" ? "☾" : "☀";
        try {
          localStorage.setItem("theme", t);
        } catch (e) {}
        applyPal();
      }
      setTheme(document.documentElement.dataset.theme == "light" ? "light" : "dark");
      thm.onclick = () => setTheme(document.documentElement.dataset.theme == "light" ? "dark" : "light");
      // ===== 8. FOND ET PHOTO AUTOMATIQUES =====
      // Dépose fond.jpg et photo.jpg à côté de index.html : ils s'affichent tout seuls
      function find(b, ok) {
        const x = ["jpg", "jpeg", "png", "webp"];
        let i = 0;
        (function t() {
          if (i >= x.length) return;
          const im = new Image();
          im.onload = () => ok(im, b + "." + x[i]);
          im.onerror = () => {
            i++;
            t();
          };
          im.src = b + "." + x[i];
        })();
      }
      find("fond", (im, u) => {
        document.body.classList.add("fond");
        document.body.style.backgroundImage = "url(" + u + ")";
      });
      find("photo", (im) => {
        const p = document.querySelector(".ph");
        if (p) {
          p.innerHTML = "";
          p.classList.add("has");
          p.appendChild(im);
        }
      });
    </script>
  </body>
</html>
